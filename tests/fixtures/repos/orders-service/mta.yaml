_schema-version: '3.1'
ID: orders-service
version: 1.4.2
modules:
  - name: orders-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: orders-hana
      - name: orders-xsuaa
      - name: orders-destination
      - name: orders-messaging
  - name: orders-router
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
      - name: orders-xsuaa
resources:
  - name: orders-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: orders-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: orders-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            destinations:
              - Name: WAREHOUSE_API
                URL: https://warehouse.acme-internal.net
  - name: orders-messaging
    type: org.cloudfoundry.managed-service
    parameters:
      service: enterprise-messaging
      service-plan: default
